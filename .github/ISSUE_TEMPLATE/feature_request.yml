name: Feature request / Usulan fitur
description: Suggest an idea
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve? / Masalah apa yang diselesaikan?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposed solution / Usulan solusi
