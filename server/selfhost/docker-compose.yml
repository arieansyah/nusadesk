# Self-hosted NusaDesk signaling server with automatic HTTPS (Let's Encrypt via Caddy).
#
#   1. Point a DNS record (A/AAAA) for your domain at this machine.
#   2. Open TCP ports 80 and 443.
#   3. DOMAIN=remote.example.com docker compose up -d
#   4. In the NusaDesk app: Settings → Signaling server → wss://remote.example.com
#
# See docs/SELF_HOSTING.md for LAN-only setups and other reverse proxies.

services:
  signaling:
    build: ..
    restart: unless-stopped
    environment:
      PORT: "8787"
      NUSADESK_DB: /data/devices.json
      # Only Caddy can reach this container, so its X-Forwarded-For header is trustworthy
      TRUST_PROXY: "1"
    volumes:
      - signaling-data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 128m

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - signaling
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN=your.domain}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  signaling-data:
  caddy-data:
  caddy-config:
